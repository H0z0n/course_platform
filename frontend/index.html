<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <script>
      (function () {
        var theme = "light";
        try {
          theme = localStorage.getItem("course_platform_theme") || "light";
        } catch (error) {}
        var dark = theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        try {
          var brand = localStorage.getItem("course_platform_brand");
          if (/^#[0-9a-f]{6}$/.test(brand || "")) {
            var channels = [1, 3, 5].map(function (start) {
              var value = parseInt(brand.slice(start, start + 2), 16) / 255;
              return value <= 0.03928 ? value / 12.92 : Math.pow((value + 0.055) / 1.055, 2.4);
            });
            var light = 0.2126 * channels[0] + 0.7152 * channels[1] + 0.0722 * channels[2] > 0.2;
            document.documentElement.style.setProperty("--brand", brand);
            document.documentElement.dataset.brandTone = light ? "light" : "dark";
          }
        } catch (error) {}
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <title>Course Platform</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
